<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bize Ulaşın - Kılıç Agency</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-page {
            min-height: 100vh;
            background: #000000;
            color: #FFFFFF;
            padding: 60px 20px;
        }
        .contact-content {
            max-width: 800px;
            margin: 0 auto;
        }
        .contact-form {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            border: 1px solid #333;
            margin-top: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #E94E1B;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #E94E1B;
        }
        .submit-btn {
            background: linear-gradient(135deg, #E94E1B, #FF6B35);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 78, 27, 0.4);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #E94E1B;
            text-decoration: none;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            color: #FF6B35;
        }
    </style>
</head>
<body>
    <div class="contact-page page-enter">
        <div class="contact-content">
            <a href="index.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Geri Dön
            </a>
            
            <h1 style="font-size: 48px; margin-bottom: 20px; color: #E94E1B;">Bize Ulaşın</h1>
            <p style="font-size: 18px; color: #888; margin-bottom: 40px;">Projeleriniz için bizimle iletişime geçin</p>
            
            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="name">Ad Soyad</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-posta</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Mesaj</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Mesaj Gönder</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
