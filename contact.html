<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bize Ulaşın - Kılıç Agency</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #000000 100%);
            color: #FFFFFF;
            padding: 60px 20px;
        }
        
        .page-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px 0;
        }
        
        .page-nav .nav-link {
            color: #888;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .page-nav .nav-link:hover {
            color: #E94E1B;
            background: rgba(233, 78, 27, 0.1);
            border-color: rgba(233, 78, 27, 0.3);
            transform: translateY(-2px);
        }
        
        .page-nav .nav-link.active {
            color: #E94E1B;
            background: rgba(233, 78, 27, 0.1);
            border-color: rgba(233, 78, 27, 0.3);
        }
        .contact-content {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .contact-form {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 40px;
            border: 1px solid #333;
            margin-top: 40px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #E94E1B;
            font-weight: 500;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #E94E1B;
        }
        .submit-btn {
            background: linear-gradient(135deg, #E94E1B, #FF6B35);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 78, 27, 0.4);
        }
        
        .contact-info {
            margin-bottom: 50px;
        }
        
        .contact-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .contact-method {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #1a1a1a;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        
        .contact-method:hover {
            border-color: #E94E1B;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233, 78, 27, 0.1);
        }
        
        .method-icon {
            font-size: 32px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #E94E1B, #FF6B35);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .method-content h3 {
            color: #E94E1B;
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .method-content p {
            color: #fff;
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 500;
        }
        
        .method-content span {
            color: #888;
            font-size: 14px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .form-group select:focus {
            outline: none;
            border-color: #E94E1B;
        }
        
        .submit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #E94E1B, #FF6B35);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #E94E1B;
            text-decoration: none;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            color: #FF6B35;
        }
    </style>
</head>
<body>
    <div class="contact-page page-enter">
        <div class="contact-content">
            <div class="page-nav">
                <a href="index.html" class="nav-link">Ana Sayfa</a>
                <a href="portfolio.html" class="nav-link">Portfolyo</a>
                <a href="references.html" class="nav-link">Referanslar</a>
                <a href="contact.html" class="nav-link active">İletişim</a>
            </div>
            
            <h1 style="font-size: 48px; margin-bottom: 20px; color: #E94E1B;">Bize Ulaşın</h1>
            <p style="font-size: 18px; color: #888; margin-bottom: 40px;">Projeleriniz için bizimle iletişime geçin</p>
            
            <div class="contact-info">
                <div class="contact-methods">
                    <div class="contact-method">
                        <div class="method-icon">📧</div>
                        <div class="method-content">
                            <h3>E-posta</h3>
                            <p>info@kilicagency.com</p>
                            <span>24 saat içinde yanıt</span>
                        </div>
                    </div>
                    
                    <div class="contact-method">
                        <div class="method-icon">📱</div>
                        <div class="method-content">
                            <h3>Telefon</h3>
                            <p>0505 124 1874</p>
                            <span>Pazartesi-Cuma 09:00-18:00</span>
                        </div>
                    </div>
                    
                    <div class="contact-method">
                        <div class="method-icon">📍</div>
                        <div class="method-content">
                            <h3>Adres</h3>
                            <p>Denizli/Pamukkale</p>
                            <span>Randevu ile görüşme</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="contact-form">
                <h2 style="color: #E94E1B; margin-bottom: 30px; text-align: center;">Projenizi Anlatalım</h2>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Ad Soyad</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">E-posta</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="company">Şirket</label>
                            <input type="text" id="company" name="company">
                        </div>
                        <div class="form-group">
                            <label for="phone">Telefon</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="service">Hizmet Türü</label>
                        <select id="service" name="service" required>
                            <option value="">Seçiniz</option>
                            <option value="fotograf">Fotoğraf Çekimi</option>
                            <option value="video">Video Prodüksiyon</option>
                            <option value="web">Web Tasarım</option>
                            <option value="grafik">Grafik Tasarım</option>
                            <option value="sosyal">Sosyal Medya</option>
                            <option value="diger">Diğer</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Proje Detayları</label>
                        <textarea id="message" name="message" rows="5" placeholder="Projenizi detaylı olarak anlatın..." required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">
                        <span>Proje Teklifi Al</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
