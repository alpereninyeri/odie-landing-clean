<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Permissions-Policy" content="unload=()">
    <title>Odie - Kılıç Agency AI Asistanı</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- V2 Top Navigation -->
    <nav class="v2-top-nav">
        <div class="v2-nav-container">
            <div class="v2-nav-logo">
                <img src="logo.png" alt="Kılıç Agency" class="v2-logo-img">
                <span class="v2-logo-text">Kılıç Agency</span>
            </div>
            <div class="v2-nav-links">
                <a href="index.html" class="v2-nav-link active">Ana Sayfa</a>
                <a href="about.html" class="v2-nav-link">Hakkımızda</a>
                <a href="services.html" class="v2-nav-link">Hizmetler</a>
                <a href="blog.html" class="v2-nav-link">Blog</a>
                <a href="portfolio.html" class="v2-nav-link">Portfolyo</a>
                <a href="references.html" class="v2-nav-link">Referanslar</a>
                <a href="contact.html" class="v2-nav-link">İletişim</a>
            </div>
            <div class="v2-nav-actions">
                <button class="v2-theme-toggle" id="v2-theme-toggle" title="Tema Değiştir">
                    <svg class="v2-theme-icon v2-sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <svg class="v2-theme-icon v2-moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
                <button class="v2-hamburger" id="v2-hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Landing Page -->
    <div class="landing-page" id="landing-page">
        <div class="landing-logo">
            <img src="logo.png" alt="Kılıç Agency Logo" class="logo-image">
        </div>
        <div class="landing-content">
                <h1 class="main-title">
                    <span class="title-light">Merhaba, ben</span> <span class="title-bold">ODİE</span>
                </h1>
            <div class="typing-container">
                <span class="typing-text" id="typing-text"></span>
                <span class="cursor">|</span>
            </div>
            <div class="action-text" id="action-text">
                <span class="action-arrow">→</span>
                <span class="action-message">Aklındakini yaz, Odie ajansla aranda köprü olsun</span>
            </div>
        </div>
        
        <!-- Navigation -->
        <div class="landing-nav">
            <a href="portfolio.html" class="nav-link">Portfolyo</a>
            <a href="references.html" class="nav-link">Referanslar</a>
            <a href="contact.html" class="nav-link">İletişim</a>
        </div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="chat-input" placeholder="Odie'ye bir mesaj yaz..." autocomplete="off">
                <button id="send-btn" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <div class="footer">
            <p class="copyright">© 2025 Kılıç Agency. Tüm hakları saklıdır. | Yapay zeka (Odie) ile geliştirilmiştir.</p>
        </div>
    </div>

    <!-- Chat Interface (Hidden initially) -->
    <div class="chat-interface" id="chat-interface">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <img src="logo.png" alt="Kılıç Agency" class="header-logo">
                <h1>Odie</h1>
            </div>
        </div>
        
        <!-- Messages Container -->
        <div class="messages-container">
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be added here -->
            </div>
        </div>
        
        <!-- Navigation removed - using top nav -->
        
        <!-- Input Container -->
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="chat-input-chat" placeholder="Odie'ye bir mesaj yaz..." autocomplete="off">
                <button id="send-btn-chat" class="send-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <button class="v2-scroll-to-top" id="v2-scroll-to-top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M7 14L12 9L17 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <script src="script.js"></script>
</body>
</html>
